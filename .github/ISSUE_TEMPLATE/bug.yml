name: Bug report
description: Report a reproducible defect in Parallax for Pi
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Parallax. Do not include secrets or private project data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence of commands or actions.
      placeholder: |
        1. Install or load the extension...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: input
    id: pi-version
    attributes:
      label: Pi version
      placeholder: 0.80.10
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: 22.x
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Parallax mode
      options: [build, plan, debug, horizon, not mode-specific]
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs and evidence
      description: Include sanitized logs, trace excerpts, or failing test output.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Relevant operating system, model/provider, configuration, or regression range.
